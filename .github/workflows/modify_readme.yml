name: modify_readme

on:
  push:
    branches:
      - github_action_readme

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run jest tests
        run: |
          npm install jest
          npm test

  modify_readme:
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generar meme en el README
        uses: ./.github/actions/meme
        with:
          frase_positiva: Los tests han funcionado y lo sabes
          frase_negativa: Los tests han fallado y lo sabes
          resultado_test: ${{ needs.tests.result }}

      - name: Subir cambios del README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizado meme del README"
          file_pattern: '*.md'
